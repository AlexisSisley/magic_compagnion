name: Auto Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour créer le Tag et la Release
permissions:
  contents: write

jobs:
  build-and-release:
    name: Calculate Version & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code (avec l'historique complet pour calculer la version)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. CALCUL DE LA VERSION (Cœur de ta demande)
      - name: Calculate Semantic Version
        id: version_step
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          
          # RÈGLES CORRIGÉES :
          # Detecte "refactor" ou "BREAKING CHANGE" au début, avec ou sans parenthèses
          major_pattern: "(refactor|BREAKING CHANGE)"
          
          # Detecte "feat" au début de la ligne, peu importe la casse ou le scope
          # Ex: "feat:", "feat(api):", "Feat :"
          minor_pattern: "(feat|Feat)"
          
          # Force le Patch par défaut si rien n'est trouvé
          bump_each_commit: false
          search_commit_body: true

      # 3. Setup Java
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 7. DÉCOMPRESSION DES DONNÉES (Important !)
      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/

      # 8. BUILD APK AVEC LA NOUVELLE VERSION
      - name: Build Release APK
        run: |
          # On récupère la version calculée à l'étape 2
          VERSION_NAME=${{ steps.version_step.outputs.version }}
          # On utilise le nombre de commits total comme build number (pour l'unicité)
          BUILD_NUMBER=${{ steps.version_step.outputs.increment }}
          
          echo "BUILDING VERSION: $VERSION_NAME+$BUILD_NUMBER"
          
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER

      # 9. CRÉER LE TAG GIT ET LA RELEASE GITHUB
      - name: Create GitHub Release & Tag
        uses: ncipollo/release-action@v1
        with:
          # Utilise la version calculée comme nom de Tag
          tag: "v${{ steps.version_step.outputs.version }}"
          name: "Release v${{ steps.version_step.outputs.version }}"
          
          # Ajoute le message des commits dans la description de la release
          body: ${{ steps.version_step.outputs.changelog }}
          
          # Attache l'APK compilé à la release
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          
          # Token GitHub (automatique)
          token: ${{ secrets.GITHUB_TOKEN }}