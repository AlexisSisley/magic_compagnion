name: Auto Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour créer le Tag et la Release
permissions:
  contents: write

jobs:
  build-and-release:
    name: Calculate Version & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code (avec l'historique complet pour calculer la version)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. CALCUL DE LA VERSION (Cœur de ta demande)
      - name: Calculate Semantic Version
        id: version_step
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          
          # --- RÈGLES DE VERSIONNING ---
          
          # MAJOR : Uniquement si "BREAKING CHANGE" ou "!" (ex: feat!: changement cassant)
          # J'ai retiré 'refactor' d'ici car c'est dangereux pour la version Major
          major_pattern: "(BREAKING CHANGE|!)"
          
          # MINOR : Déclenche sur "feat:" ou "feat(scope):" ou "Feat :"
          # L'expression "^(feat|Feat)" assure qu'on cherche au début du mot clé
          minor_pattern: "^(feat|Feat)(\\(|:)"
          
          # PATCH : C'est le comportement par défaut si rien au dessus ne match.
          # (fix, docs, style, refactor, perf, test, chore...) tomberont ici.
          
          # --- CONFIGURATION GIT ---
          bump_each_commit: false   # On veut 1 version par release, pas par commit
          search_commit_body: true  # Cherche aussi dans la description (utile si Squash merge)
          user_format_type: "csv"

      # 3. Setup Java
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 7. DÉCOMPRESSION DES DONNÉES (Important !)
      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/

      # 8. BUILD APK AVEC LA NOUVELLE VERSION
      - name: Build Release APK
        run: |
          # On récupère la version calculée à l'étape 2
          VERSION_NAME=${{ steps.version_step.outputs.version }}
          # On utilise le nombre de commits total comme build number (pour l'unicité)
          BUILD_NUMBER=${{ steps.version_step.outputs.increment }}
          
          echo "BUILDING VERSION: $VERSION_NAME+$BUILD_NUMBER"
          
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER

      # 9. CRÉER LE TAG GIT ET LA RELEASE GITHUB (CORRIGÉ)
      # Étape de vérification pour être sûr que le fichier est là avant l'upload
      - name: Check Artifact Existence
        run: |
          ls -la build/app/outputs/flutter-apk/
          echo "Fichier à uploader : build/app/outputs/flutter-apk/app-release.apk"

      - name: Create GitHub Release & Tag
        uses: ncipollo/release-action@v1
        with:
          # Utilise la version calculée comme nom de Tag
          tag: "v${{ steps.version_step.outputs.version }}"
          name: "Release v${{ steps.version_step.outputs.version }}"
          
          # Ajoute le message des commits dans la description de la release
          body: ${{ steps.version_step.outputs.changelog }}
          
          # Attache l'APK compilé à la release
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          
          # Token GitHub
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # RÈGLES IMPORTANTES AJOUTÉES :
          allowUpdates: true       # Permet de modifier une release existante si elle a échoué avant
          replacesArtifacts: true  # Force le remplacement de l'APK s'il existe déjà
          makeLatest: true         # Marque cette release comme la "Dernière" officielle