name: Auto Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour créer le Tag et la Release
permissions:
  contents: write

jobs:
  # --- 1. NOUVEAU JOB : VÉRIFICATION PYTHON ---
  check-backend:
    name: Check Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend_rag
          pip install fastapi uvicorn langchain-chroma langchain-ollama flake8

      - name: Lint with Flake8
        run: |
          # Vérifie les erreurs de syntaxe fatales (E9, F63, F7, F82)
          flake8 backend_rag --count --select=E9,F63,F7,F82 --show-source --statistics
          
  build-and-release:
    name: Calculate Version & Build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip') }}

    steps:
      # 1. Récupérer le code (avec l'historique complet pour calculer la version)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. CALCUL DE LA VERSION (Modifié selon tes critères)
      - name: Calculate Semantic Version
        id: version_step
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          
          # --- TES RÈGLES DE VERSIONNING ---
          # 1. Major : Si le commit contient "refactor" ou "BREAKING CHANGE"
          major_pattern: "(refactor|BREAKING CHANGE|Mise à jour majeure)"
          
          # 2. Minor : Si le commit contient "feat"
          minor_pattern: "(feat|Feat|feature|Feature|Ajout|New|Nouvelle|Mise à jour)"
          
          # 3. Patch : Par défaut pour tout autre commit (fix, docs, etc.)
          bump_each_commit: true 
          
          search_commit_body: true
          user_format_type: csv

      # 3. Setup Java
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 7. DÉCOMPRESSION DES DONNÉES (Important !)
      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/
      - name: Decode Keystore
        run: |
          echo "${{ secrets.PLAY_STORE_UPLOAD_KEY }}" | base64 --decode > android/app/upload-keystore.jks

      # 8. BUILD APK AVEC LA NOUVELLE VERSION
      - name: Build Release APK
        run: |
          VERSION_NAME=${{ steps.version_step.outputs.version }}
          BUILD_NUMBER=${{ steps.version_step.outputs.increment }}
          echo "BUILDING VERSION: $VERSION_NAME+$BUILD_NUMBER"
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER
        env:
          # Ces variables sont maintenant requises par build.gradle.kts
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}

      # 9. RENOMMAGE (Inspiré de ton exemple)
      # On renomme l'APK pour qu'il soit propre dans la release (ex: MagicCompagnion-v1.0.1.apk)
      - name: Rename APK
        id: rename_apk
        run: |
          OLD_PATH="build/app/outputs/flutter-apk/app-release.apk"
          NEW_FILENAME="MagicCompagnion-v${{ steps.version_step.outputs.version }}.apk"
          NEW_PATH="build/app/outputs/flutter-apk/$NEW_FILENAME"
          
          echo "Renommage de $OLD_PATH vers $NEW_PATH"
          mv $OLD_PATH $NEW_PATH
          
          # On sauvegarde le chemin dans une variable de sortie
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagicCompagnion-v${{ steps.version_step.outputs.version }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 5
      # 10. CRÉER LA RELEASE GITHUB (Avec softprops, le plus fiable)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_step.outputs.version }}
          name: Release v${{ steps.version_step.outputs.version }}
          body: ${{ steps.version_step.outputs.changelog }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
      # 11. DÉPLOIEMENT FIREBASE (Nouveau !)
      # On utilise l'APK généré et renommé à l'étape 9
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: testers
          file: ${{ steps.rename_apk.outputs.apk_path }}
          releaseNotes: |
            v${{ steps.version_step.outputs.version }}
            
            CHANGELOG AUTOMATIQUE :
            ${{ steps.version_step.outputs.changelog }}
            
            DÉTAIL DU DERNIER COMMIT :
            ${{ github.event.head_commit.message }}