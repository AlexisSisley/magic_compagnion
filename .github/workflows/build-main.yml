name: Auto Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour créer le Tag et la Release
permissions:
  contents: write

jobs:
  build-and-release:
    name: Calculate Version & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code (avec l'historique complet pour calculer la version)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. CALCUL DE LA VERSION (Cœur de ta demande)
      - name: Calculate Semantic Version
        id: version_step
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          # Détection explicite des changements majeurs et mineurs
          major_pattern: "(BREAKING CHANGE|feat!|fix!|refactor!)"
          minor_pattern: "^(feat|Feat)"
          bump_each_commit: false
          search_commit_body: true
          user_format_type: csv

      # 3. Setup Java
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 7. DÉCOMPRESSION DES DONNÉES (Important !)
      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/

      # 8. BUILD APK AVEC LA NOUVELLE VERSION
      - name: Build Release APK
        run: |
          VERSION_NAME=${{ steps.version_step.outputs.version }}
          BUILD_NUMBER=${{ steps.version_step.outputs.increment }}
          echo "BUILDING VERSION: $VERSION_NAME+$BUILD_NUMBER"
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER

      # 9. RENOMMAGE (Inspiré de ton exemple)
      # On renomme l'APK pour qu'il soit propre dans la release (ex: MagicCompagnion-v1.0.1.apk)
      - name: Rename APK
        id: rename_apk
        run: |
          OLD_PATH="build/app/outputs/flutter-apk/app-release.apk"
          NEW_FILENAME="MagicCompagnion-v${{ steps.version_step.outputs.version }}.apk"
          NEW_PATH="build/app/outputs/flutter-apk/$NEW_FILENAME"
          
          echo "Renommage de $OLD_PATH vers $NEW_PATH"
          mv $OLD_PATH $NEW_PATH
          
          # On sauvegarde le chemin dans une variable de sortie pour l'étape suivante
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      # 10. CRÉER LA RELEASE GITHUB (Avec softprops, le plus fiable)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_step.outputs.version }}
          name: Release v${{ steps.version_step.outputs.version }}
          body: ${{ steps.version_step.outputs.changelog }}
          
          # On utilise le fichier renommé
          files: ${{ steps.rename_apk.outputs.apk_path }}
          
          # Force la mise à jour si le tag existe déjà (très utile pour le debug)
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}