name: Auto Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions necessaires pour creer le Tag et la Release
permissions:
  contents: write

jobs:
  # --- 1. VERIFICATION PYTHON ---
  check-backend:
    name: Check Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend_rag
          pip install fastapi uvicorn langchain-chroma langchain-ollama flake8

      - name: Lint with Flake8
        run: |
          flake8 backend_rag --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- 2. BUILD, TEST, RELEASE & DEPLOY ---
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip') }}

    steps:
      # 1. Checkout avec historique complet (pour le changelog)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. LECTURE DE LA VERSION DEPUIS pubspec.yaml (source de verite)
      - name: Read version from pubspec.yaml
        id: version_step
        run: |
          # Extraire la version depuis pubspec.yaml (ex: 1.10.0+1)
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          # Separer version et build number
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)

          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version lue depuis pubspec.yaml: $VERSION_NAME"

          # Calculer le build number depuis le nombre de commits
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Build number (commits count): $BUILD_NUMBER"

          # Generer le tag avec phase: beta pour les builds main
          TAG_NAME="v${VERSION_NAME}-beta.${BUILD_NUMBER}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME"

          # Generer un changelog depuis le dernier tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s" --no-merges | head -30)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -10)
          fi

          # Ecrire le changelog dans un fichier (multi-ligne safe)
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      # 3. Verifier que le tag n'existe pas deja
      - name: Check tag does not exist
        run: |
          TAG="${{ steps.version_step.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Update the version in pubspec.yaml."
            exit 1
          fi
          echo "Tag $TAG is available"

      # 4. Setup Java
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup Flutter (version fixee)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      # 6. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 7. Dependances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 8. ANALYSE STATIQUE & TESTS
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unzip Data Files (for tests)
        run: |
          if [ -f assets/json/cards_data.zip ]; then
            echo "Decompression des donnees..."
            unzip -o assets/json/cards_data.zip -d assets/json/
          fi

      - name: Run Flutter Tests with Coverage
        run: flutter test --coverage

      - name: Check Coverage Threshold
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::No coverage file found, skipping threshold check"
            exit 0
          fi
          TOTAL_LINES=$(grep -c "DA:" coverage/lcov.info || echo "0")
          HIT_LINES=$(grep "DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo "0")
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::warning::No coverage data found"
            exit 0
          fi
          COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
          echo "## Coverage: ${COVERAGE}% (${HIT_LINES}/${TOTAL_LINES} lines)" >> $GITHUB_STEP_SUMMARY
          if [ "$COVERAGE" -lt 15 ]; then
            echo "::error::Coverage is ${COVERAGE}%, below required threshold of 15%"
            exit 1
          fi
          echo "Coverage OK: ${COVERAGE}% >= 15%"

      # 9. KEYSTORE
      - name: Decode Keystore
        run: |
          echo "${{ secrets.PLAY_STORE_UPLOAD_KEY }}" | base64 --decode > android/app/upload-keystore.jks

      # 10. BUILD APK avec version depuis pubspec.yaml
      - name: Build Release APK
        run: |
          VERSION_NAME=${{ steps.version_step.outputs.version }}
          BUILD_NUMBER=${{ steps.version_step.outputs.build_number }}
          echo "BUILDING VERSION: $VERSION_NAME+$BUILD_NUMBER"
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}

      # 11. RENOMMAGE APK
      - name: Rename APK
        id: rename_apk
        run: |
          OLD_PATH="build/app/outputs/flutter-apk/app-release.apk"
          TAG="${{ steps.version_step.outputs.tag_name }}"
          NEW_FILENAME="MagicCompagnion-${TAG}.apk"
          NEW_PATH="build/app/outputs/flutter-apk/$NEW_FILENAME"

          echo "Renommage: $OLD_PATH -> $NEW_PATH"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagicCompagnion-${{ steps.version_step.outputs.tag_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 5

      # 12. CREER LA RELEASE GITHUB avec tag MAJOR.MINOR.PATCH-beta.N
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: Release ${{ steps.version_step.outputs.tag_name }}
          body_path: /tmp/changelog.txt
          files: ${{ steps.rename_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. Preparer le changelog en output (pour Firebase)
      - name: Prepare changelog output
        id: changelog_output
        run: |
          # Lire le changelog et le mettre en output (delimiter method pour multi-ligne)
          echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      # 14. DEPLOIEMENT FIREBASE App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: testers
          file: ${{ steps.rename_apk.outputs.apk_path }}
          releaseNotes: |
            ${{ steps.version_step.outputs.tag_name }}

            Commits inclus:
            ${{ steps.changelog_output.outputs.changelog }}

            Dernier commit:
            ${{ github.event.head_commit.message }}
