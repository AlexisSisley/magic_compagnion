name: Deploy to Firebase App Distribution

on:
  # Déclenchement manuel pour tester ou envoyer une version spécifique
  workflow_dispatch:
  # Déclenchement automatique sur push vers la branche main (optionnel)
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configuration de Java (Requis pour Gradle & Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Optimisation : Cache des dépendances Gradle

      # 3. Configuration de Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Optimisation : Cache du SDK Flutter

      # 4. Installation des dépendances
      - name: Install Dependencies
        run: flutter pub get

      # 5. Préparation des Assets (CRITIQUE basé sur tes fichiers existants)
      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/

      # 6. Décodage du Keystore pour la signature (Sécurité)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.PLAY_STORE_UPLOAD_KEY }}" | base64 --decode > android/app/upload-keystore.jks

      # 7. Construction de l'APK (Release)
      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}

      # 8. Déploiement sur Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: testers # Nom du groupe de testeurs défini dans la console Firebase
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Mise à jour automatique via GitHub Actions - Commit: ${{ github.sha }}"