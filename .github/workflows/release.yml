name: Release to Play Store

on:
  push:
    branches:
      - 'release/**'  # Se déclenche ex: release/v1.0.0

jobs:
  build-and-sign:
    name: Build Signed Release
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du Code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuration de l'environnement
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Préparation des dépendances et des données
      - name: Install Dependencies
        run: flutter pub get

      - name: Unzip Data Files
        run: |
          echo "Décompression des données..."
          unzip assets/json/cards_data.zip -d assets/json/

      # 4. DÉCODAGE DE LA CLÉ DE SIGNATURE
      # On prend le secret (texte base64) et on le transforme en fichier .jks réel
      - name: Decode Keystore
        run: |
          echo "${{ secrets.PLAY_STORE_UPLOAD_KEY }}" | base64 --decode > android/app/upload-keystore.jks

      # 5. BUILD SIGNÉ (AAB pour le Play Store)
      # Les variables d'environnement sont passées ici pour que Gradle puisse signer
      - name: Build Signed App Bundle
        run: flutter build appbundle --release
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}

      # 6. Sauvegarde de l'artefact (pour que tu puisses le télécharger)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5

      # 7. (Optionnel) Création d'une Release GitHub avec le fichier
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/release/')
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: true  # Crée un brouillon pour que tu vérifies avant de publier